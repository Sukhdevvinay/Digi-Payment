<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🥊 Boxing Game 🥊</h1>

      <div class="hud">
        <div class="fighter-box">
          <h2>Player 1</h2>
          <div class="health-bar">
            <div id="player1HealthFill" class="health-fill blue"></div>
          </div>
          <p id="player1Stats">Health: 100 | Energy: 100</p>
        </div>

        <div class="center-box">
          <h2 id="roundDisplay">Round 1</h2>
          <p id="timeDisplay">60s</p>
          <p id="statusDisplay">Press Start</p>
        </div>

        <div class="fighter-box">
          <h2>Player 2</h2>
          <div class="health-bar">
            <div id="player2HealthFill" class="health-fill red"></div>
          </div>
          <p id="player2Stats">Health: 100 | Energy: 100</p>
        </div>
      </div>

      <canvas id="gameCanvas" width="800" height="420"></canvas>

      <div class="controls">
        <div class="control-card">
          <h3>Player 1</h3>
          <p>A / D = Move</p>
          <p>Q = Punch</p>
          <p>E = Defend</p>
        </div>
        <div class="control-card">
          <h3>Player 2</h3>
          <p>← / → = Move</p>
          <p>P = Punch</p>
          <p>O = Defend</p>
        </div>
      </div>

      <div class="actions">
        <button id="startBtn">Start Game</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </div>

    <div id="resultModal" class="modal hidden">
      <div class="modal-content">
        <h2 id="resultTitle">Fight Over</h2>
        <p id="resultMessage">Player 1 wins!</p>
        <button id="playAgainBtn">Play Again</button>
      </div>
    </div>

    <script src="Boxer.js"></script>
    <script src="Punch.js"></script>
    <script src="Game.js"></script>
    <script src="main.js"></script>
  </body>
</html>
